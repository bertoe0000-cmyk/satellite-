workflows:
  satellite-iptv-android-apk:
    name: SATELLITE IPTV Android APK
    max_build_duration: 60
    instance_type: linux
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project files
        script: flutter create --platforms=android --org com.satellite.iptv .
      - name: Install Flutter packages
        script: flutter pub get
      - name: Build installable Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
